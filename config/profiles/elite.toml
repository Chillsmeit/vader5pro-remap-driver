# ===============================================================
#  ELITE profile  -  Xbox Elite Series 2 emulation (uses Steam Input)
#
#  emulate_elite = true, so the pad is presented as an Xbox Elite 2 and the
#  M1-M4 paddles act as Elite paddles. This path generally relies on Steam
#  Input for the paddle bindings.
#
#  For a standalone setup that does NOT need Steam Input, switch to the
#  keyboard profile:
#    ./install/install.sh profile keyboard
# ===============================================================

emulate_elite = true

[gyro]
mode = "off"                # off / mouse / joystick

[stick.left]
deadzone = 128

[stick.right]
deadzone = 128

# Hold LM for gyro aim + full mouse mode
[layer.aim]
trigger = "LM"              # A/B/X/Y/LB/RB/LT/RT/M1-M4/LM/RM/C/Z
tap = "mouse_side"          # KEY_*, mouse_left/right/middle/side/extra
hold_timeout = 200          # ms before layer activates
gyro = { mode = "mouse", sensitivity = 2.0 }
stick_left = { mode = "scroll" }   # gamepad / mouse / scroll
stick_right = { mode = "mouse", sensitivity = 1.0, suppress_gamepad = true }
dpad = { mode = "arrows", suppress_gamepad = true }
remap = { RB = "mouse_left", RT = "mouse_right", RM = "mouse_middle", A = "KEY_LEFTMETA" }

# Hold RM for stick mouse + arrows
[layer.mouse]
trigger = "RM"
hold_timeout = 150
stick_right = { mode = "mouse", sensitivity = 1.5, suppress_gamepad = true }
dpad = { mode = "arrows", suppress_gamepad = true }
remap = { A = "mouse_left", B = "mouse_right" }
